<meta charset="utf-8">
<title>La Llama de Velmora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: one stage — a 16:9 canvas centred on wax-dark ground, the key legend beneath it */
:root{
  --ink:#0a0610; --ground:#120a14; --wax:#efe2c8; --ember:#f5b960; --muted:#9a8a9c; --edge:#2a1a2a;
  --f-display:"IM Fell English SC", Georgia, serif; --f-body:"Alegreya", Georgia, serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--wax);font-family:var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.stage{width:min(100%,calc((100vh - 80px) * 16 / 9));aspect-ratio:16/9;max-width:100%;border:1px solid var(--edge);box-shadow:0 0 0 4px var(--ink),0 20px 60px rgba(0,0,0,.6)}
canvas{width:100%;height:100%;display:block;outline:none}
canvas:focus-visible{box-shadow:0 0 0 2px var(--ember)}
.keys{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;max-width:100%}
.keys b{font-family:var(--f-display);color:var(--ember);font-weight:400;letter-spacing:.04em}
</style>

<div class="stage"><canvas id="game" width="960" height="540" tabindex="0" aria-label="La Llama de Velmora, juego"></canvas></div>
<div class="keys">
  <span><b>← →</b> mover</span><span><b>Z / Espacio</b> saltar</span><span><b>X</b> tajo (↑ / ↓ para apuntar)</span>
  <span><b>C / Shift</b> impulso</span><span><b>Q</b> chispa</span><span><b>R</b> (mantener) curar</span><span><b>E / ↑</b> interactuar</span><span><b>Esc</b> pausa</span>
</div>

<script>
(()=>{
'use strict';
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const VW=960, VH=540, T=32, OUT='#0a0610';
const FD='"IM Fell English SC", Georgia, serif', FB='"Alegreya", Georgia, serif';
const G=2000, MAXFALL=900, RUN=250, JUMP=680, DJUMP=600, DASH=720, POGO=600;
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

// ---------- utilidades ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const rand=(a,b)=>a+Math.random()*(b-a);
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295;}
function seeded(s){return ()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function hexRgb(h){const n=parseInt(h.slice(1),16);return `${n>>16&255},${n>>8&255},${n&255}`;}
const rgba=(rgb,a)=>`rgba(${rgb},${a})`;

// ---------- progreso persistente ----------
const SAVE_KEY='velmora-save-v1';
function defaultMeta(){return {cera:0,deaths:0,wings:false,boss:false,up:{vela:0,filo:0,luz:0,mecha:0},talk:0,wingTalk:false,endTalk:false,seenIntro:false};}
function loadMeta(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s){const m=Object.assign(defaultMeta(),s);m.up=Object.assign(defaultMeta().up,s.up||{});return m;}}catch(e){}return defaultMeta();}
function saveMeta(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(meta));}catch(e){}}
let meta=loadMeta();

// ---------- entrada ----------
const keys={}, pressed={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',

  KeyQ:'cast',KeyI:'cast',KeyR:'heal',KeyU:'heal',KeyE:'interact',Enter:'confirm',Escape:'pause',KeyP:'pause',

addEventListener('keydown',e=>{const a=KEYMAP[e.code];if(!a)return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(!keys[a])pressed[a]=true;keys[a]=true;});
addEventListener('keyup',e=>{const a=KEYMAP[e.code];if(a)keys[a]=false;});

cv.addEventListener('mousedown',e=>{cv.focus();const r=cv.getBoundingClientRect();mouse={x:(e.clientX-r.left)*VW/r.width,y:(e.clientY-r.top)*VH/r.height};pressed.click=true;});

const PAL={

  umbral:{top:'#4a1216',bot:'#0e0507',stone:'#2a161b',deep:'#170b0f',rim:'#ff6b3d',far:'#220b10',near:'#14070a'},

  galeria:{top:'#47290f',bot:'#0d0804',stone:'#2a1c11',deep:'#181009',rim:'#ffc66e',far:'#24160a',near:'#150c06'},
  ascenso:{top:'#2c1447',bot:'#08040f',stone:'#1d152e',deep:'#110c1c',rim:'#b78dff',far:'#1b102d',near:'#0f091a'},
  corazon:{top:'#5a0c0c',bot:'#0b0203',stone:'#2b1111',deep:'#170808',rim:'#ff4d2a',far:'#280808',near:'#160404'},
};
for(const k in PAL)PAL[k].rgb=hexRgb(PAL[k].rim);

function R(id,name,sub,w,h){
  const g=[];for(let y=0;y<h;y++)g.push(new Array(w).fill('.'));
  const r={id,name,sub,w,h,g,pal:PAL[id],objs:[],entries:{},exits:{}};
  r.fill=(x0,y0,x1,y1,c)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(y>=0&&y<h&&x>=0&&x<w)g[y][x]=c;return r;};
  r.box=()=>r.fill(0,0,w-1,0,'#').fill(0,0,0,h-1,'#').fill(w-1,0,w-1,h-1,'#').fill(0,h-2,w-1,h-1,'#');
  r.o=(type,x,y,extra)=>{r.objs.push(Object.assign({type,tx:x,ty:y},extra||{}));return r;};
  r.e=(id,x,y)=>{r.entries[id]={tx:x,ty:y};return r;};
  r.x=(side,to,entry)=>{r.exits[side]=[to,String(entry)];return r;};
  return r;
}
const ROOMS={};
[
  R('santuario','Santuario de la Cera','El último lugar con calor',34,17).box()

    .e(1,1,14).e(2,58,14)
    .o('L',6,14,{text:'«Los que se apagan no mueren. Olvidan. Y caminan, buscando una luz que ya no reconocen.»'})
    .o('c',12,14).o('F',26,14).o('c',32,12).o('s',39,14).o('c',53,14)
    .x('left','santuario',1).x('right','bosque',1),
  R('bosque','Bosque Hundido','Raíces que aún recuerdan el sol',50,26).box()
    .fill(0,21,0,23,'.').fill(49,8,49,10,'.')
    .fill(6,21,11,21,'=').fill(13,18,18,18,'=').fill(6,15,11,15,'=').fill(1,12,5,12,'=')
    .fill(20,15,25,15,'=').fill(28,12,33,12,'=').fill(37,11,48,12,'#')
    .fill(26,23,29,23,'^')
    .e(1,1,23).e(2,47,10)
    .o('A',3,11).o('F',30,11).o('L',44,10,{text:'«Las polillas del bosque bebían de la Llama. Cuando se apagó, se quedaron ciegas... pero no quietas.»'})
    .o('c',20,23).o('c',36,23).o('f',25,8).o('f',40,18).o('f',12,6)
    .x('left','umbral',2).x('right','galeria',1),
  R('galeria','Galería de Cera','Cada vela, un nombre',56,17).box()
    .fill(0,8,0,10,'.').fill(1,11,8,11,'#').fill(55,12,55,14,'.')
    .fill(9,13,12,13,'=').fill(20,15,23,15,'^').fill(14,10,17,10,'=').fill(24,10,28,10,'=').fill(36,8,41,8,'=')
    .e(1,1,10).e(2,54,14)
    .o('s',13,14).o('c',30,14).o('s',38,7).o('c',46,14).o('f',33,4).o('F',26,9)
    .o('L',50,14,{text:'«Aquí se fundían las velas de los difuntos. Cada vela, un nombre. Ya nadie lee los nombres.»'})
    .x('left','bosque',2).x('right','ascenso',1),
  R('ascenso','El Ascenso','Sólo sube quien tiene alas',24,40).box()
    .fill(0,35,0,37,'.').fill(10,0,13,0,'.')
    .fill(3,33,8,33,'=').fill(12,28,17,28,'=').fill(4,23,9,23,'=').fill(13,18,18,18,'=').fill(5,13,10,13,'=').fill(12,8,17,8,'=').fill(9,3,14,3,'=')
    .e(1,1,37).e(2,11,2)
    .o('L',18,37,{text:'«Sólo quien tenga alas subirá al Corazón.» Las plataformas quedan demasiado altas para un salto normal.'})
    .o('F',15,27).o('f',6,20).o('f',16,11).o('f',11,30)
    .x('left','galeria',2).x('up','corazon',1),
  R('corazon','El Corazón','Donde se apagó la Llama',40,18).box()
    .fill(0,13,0,15,'.').fill(8,11,12,11,'=').fill(27,11,31,11,'=')
    .e(1,1,15).o('B',28,15).x('left','ascenso',2),
].forEach(r=>ROOMS[r.id]=r);

const GODS={
  brasa:{name:'Brasa',title:'el Farol del Fuego',color:'#ff7a3a',quote:'¿Frío, velita? Toma un poco de mí.'},
  marea:{name:'Marea',title:'el Farol de las Aguas',color:'#45d6c8',quote:'Todo lo que cae al fondo acaba siendo mío. Tú, todavía no.'},
  velo:{name:'Velo',title:'el Farol de la Sombra',color:'#a77bff',quote:'Entre la llama y la sombra hay un filo. Camina por él.'},
  espina:{name:'Espina',title:'el Farol de las Raíces',color:'#8fd14f',quote:'Las raíces recuerdan la luz. Clávalas hondo.'},
};
const BOONS=[
  {id:'igneo',god:'brasa',name:'Tajo Ígneo',desc:'Tus tajos y chispas queman: 12 de daño por segundo durante 3 s.'},
  {id:'estela',god:'brasa',name:'Estela Ardiente',desc:'Tu impulso deja un rastro de fuego que hiere a quien lo pise.'},
  {id:'voraz',god:'brasa',name:'Chispa Voraz',desc:'Tu chispa hace el doble de daño y estalla al impactar.'},
  {id:'oleaje',god:'marea',name:'Oleaje',desc:'Tus tajos hacen un 30% más de daño y empujan mucho más lejos.'},
  {id:'corriente',god:'marea',name:'Corriente',desc:'Puedes usar el impulso dos veces antes de tocar el suelo.'},
  {id:'mareaviva',god:'marea',name:'Marea Viva',desc:'+2 velas máximas durante este descenso y te cura por completo.'},
  {id:'paso',god:'velo',name:'Paso Sombrío',desc:'Tras un impulso, tu siguiente tajo hace el triple de daño.'},
  {id:'filo',god:'velo',name:'Filo Oculto',desc:'20% de probabilidad de golpe crítico (×2,5).'},
  {id:'ocaso',god:'velo',name:'Ocaso',desc:'Corres un 15% más rápido y quedas intocable más tiempo al recibir daño.'},
  {id:'zarza',god:'espina',name:'Zarza',desc:'Al recibir daño, las espinas hieren a todo lo cercano (40 de daño).'},
  {id:'raiz',god:'espina',name:'Raíz Profunda',desc:'El tajo hacia abajo hace el doble de daño y te devuelve el impulso.'},
  {id:'savia',god:'espina',name:'Savia',desc:'Tus golpes cargan un 60% más de luz.'},
];
const UPG=[
  {id:'vela',name:'Vela de Reserva',desc:'+1 vela máxima en cada descenso.',max:3,cost:l=>25+l*25},
  {id:'filo',name:'Filo Templado',desc:'+4 de daño en cada tajo.',max:3,cost:l=>30+l*30},
  {id:'luz',name:'Mecha Encendida',desc:'Empiezas cada descenso con la luz llena.',max:1,cost:()=>45},
  {id:'mecha',name:'Segunda Mecha',desc:'Una vez por descenso, al derretirte vuelves con media vida.',max:1,cost:()=>90},
];
const INTRO=['Antes del Astro Caído, Velmora no conocía la noche.','Luego la Llama Madre se apagó, y con ella todo lo que ardía.','En el último santuario, una vieja farolera fundió la única vela que quedaba...','...y de esa cera, despertaste tú.'];
const ORLA_SEQ=[
  ['Ah... la cera aún te sostiene. Bien.','Te moldeé con lo último que quedaba de la Llama Madre. Te llamaré Ilo: «mecha», en la lengua vieja.','Allá abajo, en el Corazón, algo la apagó. Baja y vuelve a encenderla.','Si te derrites, la cera vuelve al molde, y el molde vuelve a mí. No temas caer.'],
  ['Te derretiste. Pasa. La primera vez siempre duele más de lo que debería.','Usa el Molde. La cera que traes de abajo puede hacerte más fuerte.'],
  ['Los Faroles te hablaron, ¿verdad? Brasa, Marea, Velo, Espina...','Ardían alrededor de la Llama Madre como guardianes. Cuando cayó el Astro, se hundieron con ella.','Son caprichosos. Pero mientras te den su luz, acéptala.'],
  ['Había otro farolero. Él cuidaba la Llama conmigo.','Cuando se apagó, bajó a buscarla. No volvió.','Si lo encuentras... no mires su linterna. Ya no da luz.'],
  ['El Bosque Hundido estaba lleno de polillas. Bebían de la luz.','Dicen que sus alas siguen allí, en lo alto, donde ninguna sombra llega.'],
  ['Cada vez vuelves un poco distinto. Un poco más tú.','Quizá eso es una vela: algo que se gasta para llegar a ser.'],
];
const ORLA_WINGS=['¿Alas de polilla? Entonces el Ascenso ya no te queda lejos.','Sube, Ilo. El Corazón está justo encima.'];
const ORLA_IDLE=['Baja cuando estés listo. La cera espera.','El Molde está a la izquierda, si traes cera.','Escucha a los Faroles. Y no te fíes del todo de ninguno.'];
const ORLA_END=['¿Lo sientes? Ese calor en la cera... la Llama Madre arde otra vez.','El Farolero por fin descansa. Gracias, Ilo.','Velmora tardará en despertar. Pero ya tiene una luz por la que despertar.'];

// ---------- estado ----------
let state='title', room=null, tiles=null, bg=null, time=0;
let enemies=[], projs=[], pickups=[], parts=[], nums=[], slashes=[], props=[];
let boss=null, cam={x:0,y:0}, shake=0, hitstop=0, banner=null, dialog=null, choice=null, shop=null, trans=null;
let deadT=0, endT=0, flashA=0, flashCol='#fff', eraseArm=0, ceraPulse=0, saveTimer=0, dirty=false;
let run=null;
const P={x:0,y:0,w:18,h:28,vx:0,vy:0,face:1,onGround:false,wasGround:false,coyote:0,jumpBuf:0,airJumps:1,dashT:0,dashCD:0,dashCharges:1,
  atkT:0,atkCD:0,atkDir:'side',combo:0,comboT:0,atkHits:new Set(),pogoDone:false,inv:0,hp:5,luz:0,healT:0,castCD:0,dropT:0,squash:0,
  critNext:false,safeX:0,safeY:0,trail:[],fireT:0};
const embers=[];for(let i=0;i<60;i++)embers.push({x:rand(0,VW),y:rand(0,VH),vy:rand(-30,-10),vx:rand(-8,8),s:rand(0.8,2.2),ph:rand(0,6)});

const has=id=>!!run&&run.boons.includes(id);
const maxHp=()=>5+meta.up.vela+(run?run.extraHp:0);
function newRun(){
  const gods=shuffle(['brasa','marea','velo','espina']);
  run={boons:[],extraHp:0,revive:meta.up.mecha,cera:0,faroles:{umbral:{god:gods[0]},bosque:{god:gods[1]},galeria:{god:gods[2]},ascenso:{god:gods[3]}}};
  P.hp=maxHp(); P.luz=meta.up.luz?100:0; P.inv=0; P.critNext=false;
}

// ---------- tiles ----------
function tileAt(tx,ty){if(!room||ty<0||ty>=room.h||tx<0||tx>=room.w)return '.';return room.g[ty][tx];}
const solidPt=(x,y)=>tileAt(Math.floor(x/T),Math.floor(y/T))==='#';
const isFloor=(tx,ty)=>{const c=tileAt(tx,ty);return c==='#'||c==='=';};

function buildTiles(r){
  const c=document.createElement('canvas');c.width=r.w*T;c.height=r.h*T;const g=c.getContext('2d');const pal=r.pal;
  const S=(x,y)=>(x<0||y<0||x>=r.w||y>=r.h)?true:r.g[y][x]==='#';
  for(let y=0;y<r.h;y++)for(let x=0;x<r.w;x++){
    const ch=r.g[y][x],X=x*T,Y=y*T,h=hash(x,y);
    if(ch==='#'){
      const inner=S(x-1,y)&&S(x+1,y)&&S(x,y-1)&&S(x,y+1);
      g.fillStyle=inner?pal.deep:pal.stone;g.fillRect(X,Y,T,T);
      if(!inner){g.fillStyle=pal.deep;if(h<0.5)g.fillRect(X+Math.floor(h*40)%20+2,Y+Math.floor(h*90)%18+8,10,3);if(h>0.7)g.fillRect(X+6,Y+18,3,9);}
    }
  }
  for(let y=0;y<r.h;y++)for(let x=0;x<r.w;x++){
    const ch=r.g[y][x],X=x*T,Y=y*T,h=hash(x+7,y+3);
    if(ch==='#'){
      g.fillStyle=OUT;
      if(!S(x,y-1)){g.fillRect(X,Y,T,4);g.save();g.shadowColor=pal.rim;g.shadowBlur=10;g.fillStyle=pal.rim;g.fillRect(X,Y+4,T,2);g.restore();
        g.fillStyle=rgba(pal.rgb,0.18);g.fillRect(X,Y+6,T,5);}
      if(!S(x,y+1)){g.fillStyle=OUT;g.fillRect(X,Y+T-4,T,4);
        if(h<0.45){g.fillStyle=pal.stone;g.beginPath();g.moveTo(X+8,Y+T);g.lineTo(X+12,Y+T+6+h*14);g.lineTo(X+16,Y+T);g.fill();g.strokeStyle=OUT;g.lineWidth=2;g.stroke();}}
      g.fillStyle=OUT;
      if(!S(x-1,y)){g.fillRect(X,Y,4,T);g.fillStyle=rgba(pal.rgb,0.25);g.fillRect(X+4,Y,2,T);}
      g.fillStyle=OUT;
      if(!S(x+1,y)){g.fillRect(X+T-4,Y,4,T);}
    }else if(ch==='='){
      g.fillStyle=pal.stone;g.fillRect(X,Y,T,10);g.fillStyle=OUT;g.fillRect(X,Y,T,3);g.fillRect(X,Y+10,T,3);
      g.save();g.shadowColor=pal.rim;g.shadowBlur=8;g.fillStyle=pal.rim;g.fillRect(X,Y+3,T,2);g.restore();
      if((x+y)%3===0){g.fillStyle=OUT;g.fillRect(X+13,Y+13,5,8);}
    }else if(ch==='^'){
      for(let i=0;i<3;i++){const sx=X+2+i*10;g.fillStyle=pal.deep;g.beginPath();g.moveTo(sx,Y+T);g.lineTo(sx+5,Y+T*0.42);g.lineTo(sx+10,Y+T);g.closePath();g.fill();
        g.strokeStyle=OUT;g.lineWidth=2;g.stroke();g.fillStyle=pal.rim;g.beginPath();g.moveTo(sx+3.5,Y+T*0.62);g.lineTo(sx+5,Y+T*0.42);g.lineTo(sx+6.5,Y+T*0.62);g.fill();}
    }
  }
  return c;
}
function setArena(locked){const r=ROOMS.corazon;for(let y=13;y<=15;y++)r.g[y][0]=locked?'#':'.';if(room===r)tiles=buildTiles(r);}

function makeBg(r){
  const rnd=seeded(hashStr(r.id));const layers=[];
  [[0.3,r.pal.far],[0.6,r.pal.near]].forEach(([p,col])=>{
    const span=(r.w*T-VW)*p+VW+300;const items=[];let x=-120;
    while(x<span){const k=rnd();const kind=k<0.42?'pillar':k<0.75?'arch':'chain';
      const w=kind==='arch'?150+rnd()*130:kind==='pillar'?30+rnd()*40:8;
      items.push({kind,x,w,h:(p<0.5?160:110)+rnd()*240,s:rnd()});x+=w+50+rnd()*160;}
    layers.push({p,col,items});
  });
  const rays=[];for(let i=0;i<3;i++)rays.push({x:rnd()*VW,w:60+rnd()*110,s:rnd()*6});
  return {layers,rays};
}

// ---------- cámara ----------
function clampCam(v,size,view){return size<=view?(size-view)/2:clamp(v,0,size-view);}
function camTarget(){return {x:clampCam(P.x+P.w/2-VW/2+P.face*60,room.w*T,VW),y:clampCam(P.y+P.h/2-VH/2-30,room.h*T,VH)};}

// ---------- salas ----------
function loadRoom(id,entry,carry){
  const prev=room;
  if(id==='corazon')setArena(false);
  room=ROOMS[id];tiles=buildTiles(room);bg=room.bg||(room.bg=makeBg(room));
  enemies=[];projs=[];pickups=[];slashes=[];props=[];boss=null;
  for(const o of room.objs){
    const x=o.tx*T+16,y=(o.ty+1)*T;
    if('cfs'.includes(o.type))enemies.push(mkEnemy(o.type,x,y));

  }

  P.vx=carry?carry.vx:0;P.vy=carry?carry.vy:0;P.dashT=0;P.atkT=0;P.safeX=P.x;P.safeY=P.y;P.trail=[];

}

  const ex=room.exits[side];if(!ex)return false;
  state='trans';trans={t:0,to:ex[0],entry:ex[1],carry:{vx:side==='up'?0:P.vx,vy:side==='up'?-300:0},loaded:false};return true;

// ---------- física ----------
function moveX(e,dx){
  e.x+=dx;const y0=Math.floor(e.y/T),y1=Math.floor((e.y+e.h-0.01)/T);
  if(dx>0){const tx=Math.floor((e.x+e.w)/T);for(let ty=y0;ty<=y1;ty++)if(tileAt(tx,ty)==='#'){e.x=tx*T-e.w;e.vx=0;return true;}}
  else if(dx<0){const tx=Math.floor(e.x/T);for(let ty=y0;ty<=y1;ty++)if(tileAt(tx,ty)==='#'){e.x=(tx+1)*T;e.vx=0;return true;}}
  return false;
}
function moveY(e,dy){
  const prevBot=e.y+e.h;e.y+=dy;e.onGround=false;
  const x0=Math.floor(e.x/T),x1=Math.floor((e.x+e.w-0.01)/T);
  if(dy>0){const ty=Math.floor((e.y+e.h)/T);for(let tx=x0;tx<=x1;tx++){const c=tileAt(tx,ty);
    if(c==='#'||(c==='='&&!(e.dropT>0)&&prevBot<=ty*T+0.5)){e.y=ty*T-e.h;e.vy=0;e.onGround=true;return true;}}}
  else if(dy<0){const ty=Math.floor(e.y/T);for(let tx=x0;tx<=x1;tx++)if(tileAt(tx,ty)==='#'){e.y=(ty+1)*T;e.vy=0;return true;}}
  return false;
}
function spikeRects(b,fn){
  const x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w)/T),y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(tileAt(tx,ty)==='^'){if(fn({x:tx*T+3,y:ty*T+T*0.45,w:T-6,h:T*0.55}))return true;}
  return false;
}
const touchingSpikes=b=>spikeRects(b,s=>overlap(b,s));
function standingOnOneWay(p){const ty=Math.floor((p.y+p.h+1)/T);let one=false;for(let tx=Math.floor(p.x/T);tx<=Math.floor((p.x+p.w-0.01)/T);tx++){const c=tileAt(tx,ty);if(c==='#')return false;if(c==='=')one=true;}return one;}
function safeGround(p){
  const ty=Math.floor((p.y+p.h+1)/T),x0=Math.floor(p.x/T)-1,x1=Math.floor((p.x+p.w)/T)+1;
  for(let tx=x0;tx<=x1;tx++){if(tileAt(tx,ty)==='^'||tileAt(tx,ty-1)==='^')return false;}
  for(let tx=x0+1;tx<=x1-1;tx++)if(!isFloor(tx,ty))return false;
  return true;
}

function part(x,y,vx,vy,life,col,size,o){if(parts.length>700)return;parts.push({x,y,vx,vy,life,max:life,col,size,g:(o&&o.g)||0,glow:!!(o&&o.glow),drag:(o&&o.drag)||0});}

}
function mkBoss(x,y){return {type:'B',x:x-28,y:y-96,w:56,h:96,hp:500,maxHp:500,cera:0,vx:0,vy:0,face:-1,flash:0,burn:0,burnTick:0,state:'sleep',t:0,onGround:false,summonCd:0,phase:1,airT:0,rained:false,hitWall:false};}

    e.vy=Math.min(e.vy+G*dt,MAXFALL);

    const hit=moveX(e,vx*dt);if(hit&&Math.abs(e.kb)<1)e.face*=-1;
    moveY(e,e.vy*dt);
    if(e.onGround&&Math.abs(e.kb)<1){const fx=e.face>0?e.x+e.w+2:e.x-2;if(!isFloor(Math.floor(fx/T),Math.floor((e.y+e.h+4)/T))||tileAt(Math.floor(fx/T),Math.floor((e.y+e.h-4)/T))==='^')e.face*=-1;}
  }else if(e.type==='f'){

    if(e.cd<=0){if(e.charging){const t=0.85;projs.push({kind:'glob',hostile:true,x:ecx,y:e.y+6,vx:clamp(dx/t,-520,520),vy:(dy-0.5*1200*t*t)/t,g:1200,r:7,life:4});burst(ecx,e.y+6,8,'#d9b98a',160,{g:600});}
      e.cd=2.2;e.charging=false;}
  }

function lanternBox(b){return {x:b.face>0?b.x+b.w-4:b.x-44,y:b.y+30,w:48,h:44};}

function chooseBossMove(b){

  if(p.atkDir==='up')return {x:p.x+p.w/2-26,y:p.y-50,w:52,h:52};

}

  let crit=false;if(P.critNext){d*=3;P.critNext=false;crit=true;}else if(has('filo')&&Math.random()<0.2){d*=2.5;crit=true;}

function updatePlayer(dt){

    slashes.push({dir:p.atkDir,face:p.face,t:0,combo:p.combo});
  }
  if(pressed.cast&&!healing){
    if(p.luz>=33&&p.castCD<=0){p.luz-=33;p.castCD=0.35;const boom=has('voraz');
      projs.push({kind:'spark',x:p.x+p.w/2+p.face*14,y:p.y+12,vx:p.face*760,vy:0,r:8,dmg:boom?50:25,life:1.2,boom});p.vx-=p.face*120;}
  }
  moveX(p,p.vx*dt);moveY(p,p.vy*dt);
  if(p.onGround){
    if(!p.wasGround){p.squash=1;burst(p.x+p.w/2,p.y+p.h,5,'#c9b8a6',90);}
    p.coyote=0.1;p.airJumps=1;p.dashCharges=has('corriente')?2:1;
    if(safeGround(p)){p.safeX=p.x;p.safeY=p.y;}
  }else p.coyote=Math.max(0,p.coyote-dt);
  p.wasGround=p.onGround;
  if(p.atkT>0){p.atkT-=dt;resolveAttack();}
  for(const tr of p.trail)tr.a-=dt*2.2;p.trail=p.trail.filter(tr=>tr.a>0);
  if(touchingSpikes(p)){
    hurtPlayer(null);
    if(state==='play'){p.x=p.safeX;p.y=p.safeY;p.vx=0;p.vy=0;p.dashT=0;flashA=Math.max(flashA,0.5);flashCol='#000';}
    return;
  }
  const cx=p.x+p.w/2,cy=p.y+p.h/2;let side=null;
  if(cx<0)side='left';else if(cx>room.w*T)side='right';else if(cy<0)side='up';else if(cy>room.h*T)side='down';
  if(side&&!startTrans(side)){p.x=clamp(p.x,0,room.w*T-p.w);p.y=clamp(p.y,0,room.h*T-p.h);}
}

// ---------- proyectiles y recogibles ----------
function circleRect(c,r){const nx=clamp(c.x,r.x,r.x+r.w),ny=clamp(c.y,r.y,r.y+r.h);return Math.hypot(c.x-nx,c.y-ny)<c.r;}
function impact(q){q.dead=true;
  if(q.boom){for(const e of enemies)if(!e.dead&&Math.hypot(e.x+e.w/2-q.x,e.y+e.h/2-q.y)<85)damageEnemy(e,Math.round(q.dmg*0.6),{col:'#ff9a4a'});burst(q.x,q.y,30,'#ff8a3a',380,{glow:true});shake=Math.max(shake,6);}
  else burst(q.x,q.y,12,'#ffd27a',220,{glow:true});}
function updProjs(dt){
  for(let i=0;i<projs.length;i++){const q=projs[i];
    q.life-=dt;if(q.life<=0){q.dead=true;continue;}
    if(q.kind==='spark'){q.x+=q.vx*dt;part(q.x,q.y,rand(-30,30),rand(-30,30),0.3,'#ffcf6a',2.5,{glow:true});
      if(solidPt(q.x,q.y)){impact(q);continue;}
      for(const e of enemies)if(!e.dead&&e.state!=='dying'&&circleRect(q,e)){damageEnemy(e,q.dmg,{col:'#ffd27a'});if(has('igneo'))e.burn=3;impact(q);break;}}
    else if(q.kind==='glob'){q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
      if(solidPt(q.x,q.y+q.r*0.5)){q.dead=true;burst(q.x,q.y,10,'#d9b98a',180,{g:700});}
      else if(state==='play'&&circleRect(q,P)){if(hurtPlayer(q.x))q.dead=true;}}
    else if(q.kind==='shock'){q.x+=q.vx*dt;const tx=Math.floor((q.vx>0?q.x+q.w:q.x)/T),ty=Math.floor((q.y+q.h/2)/T);
      if(tileAt(tx,ty)==='#'){q.dead=true;continue;}
      if(Math.random()<0.7)part(q.x+q.w/2,q.y+q.h,rand(-30,30),rand(-220,-80),0.4,'#ff9a5a',3,{glow:true});
      if(overlap(q,P))hurtPlayer(q.x+q.w/2);}
    else if(q.kind==='warn'){q.t-=dt;if(q.t<=0){q.dead=true;projs.push({kind:'glob',hostile:true,x:q.x,y:T*1.3,vx:0,vy:200,g:1600,r:9,life:3});}}
    else if(q.kind==='fire'){q.tick-=dt;if(Math.random()<0.4)part(q.x+rand(0,q.w),q.y+q.h,rand(-10,10),rand(-90,-40),0.4,'#ff7a3a',2.5,{glow:true});
      if(q.tick<=0){q.tick=0.25;for(const e of enemies)if(!e.dead&&overlap(q,e))damageEnemy(e,5,{col:'#ff9a4a'});}}
  }
  projs=projs.filter(q=>!q.dead);
}
function updPickups(dt){
  for(const k of pickups){k.t+=dt;
    if(k.t<0.45){k.vy+=1400*dt;k.x+=k.vx*dt;k.y+=k.vy*dt;if(solidPt(k.x,k.y+4)){k.vy*=-0.4;k.y-=3;k.vx*=0.7;}}
    else{const dx=P.x+P.w/2-k.x,dy=P.y+P.h/2-k.y,d=Math.hypot(dx,dy)||1,s=Math.min(950,220+k.t*800);k.x+=dx/d*s*dt;k.y+=dy/d*s*dt;
      if(d<16){k.dead=true;meta.cera+=k.amt;run.cera+=k.amt;ceraPulse=0.3;dirty=true;}}}
  pickups=pickups.filter(k=>!k.dead);
}

// ---------- interacción ----------
function newTalk(){if(meta.boss)return !meta.endTalk;return (meta.wings&&!meta.wingTalk)||(meta.talk<=meta.deaths&&meta.talk<ORLA_SEQ.length);}
function orlaLines(){
  if(meta.boss){meta.endTalk=true;return ORLA_END;}
  if(meta.wings&&!meta.wingTalk){meta.wingTalk=true;return ORLA_WINGS;}
  if(meta.talk<=meta.deaths&&meta.talk<ORLA_SEQ.length)return ORLA_SEQ[meta.talk++];
  return [ORLA_IDLE[Math.floor(Math.random()*ORLA_IDLE.length)]];
}
function openDialog(speaker,col,lines,onEnd){dialog={speaker,col,lines,i:0,t:0,onEnd};state='dialog';}
function nearProp(){const cx=P.x+P.w/2,fy=P.y+P.h;for(const o of props){if(o.type==='A')continue;if(Math.abs(o.x-cx)<36&&Math.abs(o.y-fy)<44)return o;}return null;}
function promptFor(o){
  if(o.type==='O')return 'Hablar con Orla';if(o.type==='L')return 'Leer el mural';if(o.type==='M')return 'Refundir en el Molde';if(o.type==='H')return 'Contemplar la Llama';
  if(o.type==='F'){const f=run.faroles[room.id];return f&&!f.taken?'Escuchar a '+GODS[f.god].name:null;}return null;}
function interact(o){
  if(o.type==='O'){const l=orlaLines();saveMeta();openDialog('Orla, la última farolera','#f5b960',l);}
  else if(o.type==='L')openDialog('Mural','#c9b8a6',[o.text]);
  else if(o.type==='H')openDialog('La Llama Madre','#ffb84a',[meta.boss?'La Llama Madre arde, alta y tranquila. Su calor llega hasta el Umbral.':'Fría. En el fondo del brasero queda un rescoldo del tamaño de una uña.']);
  else if(o.type==='M'){shop={sel:0,msg:'',msgT:0};state='shop';}
  else if(o.type==='F'){const f=run.faroles[room.id];if(!f||f.taken)return;
    let opts=BOONS.filter(b=>b.god===f.god&&!has(b.id));
    while(opts.length<3)opts.push({id:'gen_hp',god:f.god,name:'Cera Extra',desc:'+1 vela máxima durante este descenso y recuperas una.'});
    choice={god:f.god,opts:opts.slice(0,3),sel:0,t:0};state='choice';}
}
function pickBoon(b){
  run.boons.push(b.id);
  if(b.id==='mareaviva'){run.extraHp+=2;P.hp=maxHp();}
  if(b.id==='gen_hp'){run.extraHp+=1;P.hp=Math.min(P.hp+1,maxHp());}
  run.faroles[room.id].taken=true;state='play';
  const col=GODS[choice.god].color;flashA=0.35;flashCol=col;burst(P.x+P.w/2,P.y+P.h/2,40,col,380,{glow:true});
  banner={text:b.name,sub:'Don de '+GODS[choice.god].name,t:0};choice=null;
}

// ---------- update ----------
function update(dt){
  time+=dt;
  for(const e of embers){e.x+=e.vx*dt+Math.sin(time+e.ph)*6*dt;e.y+=e.vy*dt;if(e.y<-10){e.y=VH+10;e.x=rand(0,VW);}}
  for(const q of parts){q.life-=dt;q.vy+=q.g*dt;if(q.drag){q.vx*=1-q.drag*dt;q.vy*=1-q.drag*dt;}q.x+=q.vx*dt;q.y+=q.vy*dt;}
  parts=parts.filter(q=>q.life>0);
  for(const n of nums)n.t+=dt;nums=nums.filter(n=>n.t<0.9);
  for(const s of slashes)s.t+=dt;slashes=slashes.filter(s=>s.t<0.14);
  if(banner){banner.t+=dt;if(banner.t>3.2)banner=null;}
  flashA=Math.max(0,flashA-dt*2.2);shake=Math.max(0,shake-dt*40);ceraPulse=Math.max(0,ceraPulse-dt);eraseArm=Math.max(0,eraseArm-dt);
  saveTimer+=dt;if(dirty&&saveTimer>2){saveMeta();dirty=false;saveTimer=0;}

  if(state==='title'){if(pressed.confirm||pressed.click||pressed.jump){state='play';
      if(!meta.seenIntro)openDialog('','#f5b960',INTRO,()=>{meta.seenIntro=true;saveMeta();});}return;}
  if(state==='trans'){trans.t+=dt;if(!trans.loaded&&trans.t>=0.18){loadRoom(trans.to,trans.entry,trans.carry);trans.loaded=true;}
    if(trans.t>=0.36){state='play';trans=null;}return;}
  if(state==='dialog'){dialog.t+=dt;const len=dialog.lines[dialog.i].length;
    if(pressed.confirm||pressed.interact||pressed.jump||pressed.attack||pressed.click){
      if(dialog.t*55<len)dialog.t=len/55+0.01;
      else{dialog.i++;dialog.t=0;if(dialog.i>=dialog.lines.length){const cb=dialog.onEnd;dialog=null;state='play';if(cb)cb();}}}
    return;}
  if(state==='choice'){choice.t+=dt;const n=choice.opts.length;
    if(pressed.left)choice.sel=(choice.sel+n-1)%n;if(pressed.right)choice.sel=(choice.sel+1)%n;
    if(choice.t>0.35){
      if(pressed.c1)return pickBoon(choice.opts[0]);if(pressed.c2&&n>1)return pickBoon(choice.opts[1]);if(pressed.c3&&n>2)return pickBoon(choice.opts[2]);
      if(pressed.click){for(let i=0;i<n;i++){const r=cardRect(i,n);if(mouse.x>r.x&&mouse.x<r.x+r.w&&mouse.y>r.y&&mouse.y<r.y+r.h)return pickBoon(choice.opts[i]);}}
      if(pressed.confirm||pressed.interact||pressed.attack)return pickBoon(choice.opts[choice.sel]);}
    return;}
  if(state==='shop'){shop.msgT=Math.max(0,shop.msgT-dt);
    if(pressed.up)shop.sel=(shop.sel+UPG.length-1)%UPG.length;if(pressed.down)shop.sel=(shop.sel+1)%UPG.length;
    if(pressed.click){for(let i=0;i<UPG.length;i++){const y=172+i*72;if(mouse.y>y&&mouse.y<y+62&&mouse.x>200&&mouse.x<760){shop.sel=i;buy(UPG[i]);}}}
    if(pressed.confirm||pressed.interact||pressed.attack)buy(UPG[shop.sel]);
    if(pressed.pause||pressed.dash){state='play';shop=null;saveMeta();}
    return;}
  if(state==='pause'){
    if(pressed.erase){if(eraseArm>0){meta=defaultMeta();saveMeta();newRun();loadRoom('santuario','P');state='title';eraseArm=0;return;}eraseArm=2.5;}
    if(pressed.pause||pressed.confirm)state='play';return;}
  if(state==='dead'){deadT+=dt;if(deadT>1.6&&(pressed.confirm||pressed.jump||pressed.attack||pressed.click||deadT>5)){newRun();loadRoom('santuario','P');state='play';P.inv=1;flashA=0.6;flashCol='#ffd27a';}return;}
  if(state==='end'){endT+=dt;if(endT>2&&(pressed.confirm||pressed.click||pressed.jump)){loadRoom('santuario','P');P.hp=maxHp();state='play';}return;}

  // ---- play ----
  if(pressed.pause){state='pause';return;}
  if(hitstop>0){hitstop-=dt;return;}
  updatePlayer(dt);if(state!=='play')return;
  for(const e of enemies){
    if(e.type==='B')updBoss(e,dt);else updEnemy(e,dt);
    if(state!=='play')return;
    if(!e.dead&&!(e.type==='B'&&(e.state==='sleep'||e.state==='dying'))){
      if(overlap(P,e))hurtPlayer(e.x+e.w/2);
      if(e.type==='B'&&e.state==='sweep'&&overlap(P,lanternBox(e)))hurtPlayer(e.x+e.w/2);}
  }
  enemies=enemies.filter(e=>!e.dead);
  updProjs(dt);updPickups(dt);
  for(const o of props)if(o.type==='A'&&Math.abs(o.x-(P.x+P.w/2))<26&&Math.abs(o.y-30-(P.y+P.h/2))<40){
    props=props.filter(q=>q!==o);meta.wings=true;saveMeta();flashA=0.6;flashCol='#cfeaff';burst(o.x,o.y-30,50,'#cfeaff',360,{glow:true});
    openDialog('Alas de Polilla','#cfeaff',['Unas alas de polilla, finas como papel quemado, se funden con tu cera.','Pulsa SALTAR en el aire para dar un segundo salto. Este don no se pierde al derretirte.']);return;}
  const np=nearProp();if(np&&promptFor(np)&&(pressed.interact||pressed.up))interact(np);
  const t=camTarget();cam.x+=(t.x-cam.x)*Math.min(1,dt*6);cam.y+=(t.y-cam.y)*Math.min(1,dt*6);
}
function buy(u){
  const lvl=meta.up[u.id];
  if(lvl>=u.max){shop.msg='Ya está al máximo.';shop.msgT=1.5;return;}
  const c=u.cost(lvl);if(meta.cera<c){shop.msg='Te falta cera: necesitas '+c+'.';shop.msgT=1.5;return;}
  meta.cera-=c;meta.up[u.id]++;saveMeta();
  if(u.id==='vela')P.hp++;if(u.id==='mecha')run.revive++;if(u.id==='luz')P.luz=100;
  shop.msg=u.name+' refundida.';shop.msgT=1.5;flashA=0.3;flashCol='#ffd27a';
}

// ---------- dibujo: utilidades ----------
function glow(x,y,r,rgb,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(rgb,a));g.addColorStop(1,rgba(rgb,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
function flame(x,y,s,c1,c2){const f=1+Math.sin(time*13+x*0.1)*0.12;
  for(const [col,k] of [[c1,1],[c2,0.55]]){const h=s*k*f,w=s*k*0.5;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y-h);
    ctx.bezierCurveTo(x+w,y-h*0.45,x+w*0.9,y,x,y);ctx.bezierCurveTo(x-w*0.9,y,x-w,y-h*0.45,x,y-h);ctx.fill();}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);}
function wrap(text,maxW){const w=text.split(' ');const lines=[];let line='';for(const word of w){const t=line?line+' '+word:word;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=word;}else line=t;}if(line)lines.push(line);return lines;}
function txt(s,x,y,font,col,align,stroke){ctx.font=font;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';if(stroke){ctx.lineWidth=stroke;ctx.strokeStyle=OUT;ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=col;ctx.fillText(s,x,y);}

// ---------- dibujo: escena ----------
function drawBg(){
  const pal=room.pal;
  const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,pal.top);g.addColorStop(1,pal.bot);ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.save();ctx.globalCompositeOperation='lighter';
  glow(VW*0.5,VH*0.12,VW*0.65,pal.rgb,0.16);
  for(const r of bg.rays){let sx=((r.x+Math.sin(time*0.3+r.s)*30-cam.x*0.1)%(VW+300)+VW+300)%(VW+300)-200;
    const lg=ctx.createLinearGradient(0,0,0,VH);lg.addColorStop(0,rgba(pal.rgb,0.10));lg.addColorStop(1,rgba(pal.rgb,0));
    ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx+r.w,0);ctx.lineTo(sx+r.w*2+140,VH);ctx.lineTo(sx+r.w*0.7+140,VH);ctx.closePath();ctx.fill();}
  ctx.restore();
  const maxCy=Math.max(0,room.h*T-VH);
  for(const L of bg.layers){
    const ox=-cam.x*L.p,base=VH+(maxCy-cam.y)*L.p*0.5+20;
    ctx.fillStyle=L.col;ctx.strokeStyle=L.col;
    for(const it of L.items){const x=it.x+ox;if(x>VW+300||x+it.w<-300)continue;
      if(it.kind==='pillar'){ctx.fillRect(x,base-it.h,it.w,it.h);ctx.fillRect(x-8,base-it.h-14,it.w+16,14);ctx.fillRect(x-4,base-it.h-22,it.w+8,8);
        ctx.fillStyle=rgba(room.pal.rgb,0.08);ctx.fillRect(x,base-it.h,3,it.h);ctx.fillStyle=L.col;}
      else if(it.kind==='arch'){const pw=it.w*0.14;ctx.fillRect(x,base-it.h,pw,it.h);ctx.fillRect(x+it.w-pw,base-it.h,pw,it.h);
        ctx.lineWidth=pw*0.9;ctx.beginPath();ctx.arc(x+it.w/2,base-it.h,it.w/2-pw/2,Math.PI,0);ctx.stroke();}
      else{const len=it.h*0.7;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,len);ctx.stroke();
        for(let y=10;y<len;y+=14){ell(x,y,3,6);ctx.stroke();}
        ctx.fillRect(x-9,len,18,22);ctx.save();ctx.globalCompositeOperation='lighter';glow(x,len+11,30,room.pal.rgb,0.12+0.06*Math.sin(time*2+it.s*9));ctx.restore();ctx.fillStyle=L.col;}
    }
  }
  const fg=ctx.createLinearGradient(0,VH*0.55,0,VH);fg.addColorStop(0,rgba(pal.rgb,0));fg.addColorStop(1,rgba(pal.rgb,0.10));ctx.fillStyle=fg;ctx.fillRect(0,0,VW,VH);
}
function drawEmbers(){ctx.save();ctx.globalCompositeOperation='lighter';
  for(const e of embers){const a=0.35+0.35*Math.sin(time*3+e.ph);ctx.fillStyle=rgba(room.pal.rgb,a);ctx.fillRect(e.x,e.y,e.s,e.s);}ctx.restore();}

function drawIlo(x,y,face,alpha,ghost){
  const p=P;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.scale(face,1);
  const sq=p.squash*0.18;ctx.scale(1+sq,1-sq);
  const running=p.onGround&&Math.abs(p.vx)>20;const bob=running?-Math.abs(Math.sin(time*16))*2:0;
  ctx.rotate(p.dashT>0?0.28:running?0.07:0);
  ctx.lineJoin='round';ctx.lineWidth=3;ctx.strokeStyle=OUT;
  if(ghost){ctx.fillStyle=room.pal.rim;ctx.beginPath();ctx.moveTo(-6,-22);ctx.lineTo(7,-22);ctx.lineTo(12,0);ctx.lineTo(-11,0);ctx.closePath();ctx.fill();rr(-7,-36,15,16,5);ctx.fill();ctx.restore();return;}
  if(running){const s=Math.sin(time*16)*4;ctx.fillStyle=OUT;ell(-3+s,-1,3.5,2.5);ctx.fill();ell(4-s,-1,3.5,2.5);ctx.fill();}
  ctx.fillStyle='#8e1f2c';
  ctx.beginPath();ctx.moveTo(-6,-22+bob);ctx.lineTo(7,-22+bob);ctx.quadraticCurveTo(13,-10,12,-1);ctx.lineTo(8,-4);ctx.lineTo(5,0);ctx.lineTo(1,-3);ctx.lineTo(-3,0);ctx.lineTo(-7,-3);ctx.lineTo(-11,-1);ctx.quadraticCurveTo(-12,-12,-6,-22+bob);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.moveTo(-6,-20+bob);ctx.quadraticCurveTo(-11,-11,-9,-2);ctx.lineTo(-2,-2);ctx.lineTo(-1,-20+bob);ctx.closePath();ctx.fill();
  ctx.strokeStyle=room.pal.rim;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(-10,-3);ctx.quadraticCurveTo(-11.5,-12,-6,-20+bob);ctx.stroke();
  ctx.strokeStyle=OUT;ctx.lineWidth=3;
  if(p.atkT<=0){ctx.strokeStyle='#d8cbb0';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(9,-12+bob);ctx.quadraticCurveTo(15,-12,15,-18+bob);ctx.stroke();ctx.strokeStyle=OUT;ctx.lineWidth=3;}
  ctx.fillStyle='#efe2c8';rr(-7,-36+bob,15,16,5);ctx.fill();ctx.stroke();
  ctx.fillStyle='#d9c9a8';ctx.fillRect(-5,-23+bob,3,4);
  ctx.fillStyle=OUT;ell(2,-29+bob,1.6,2.8);ctx.fill();ell(6,-29+bob,1.6,2.8);ctx.fill();
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(1,-36+bob);ctx.lineTo(1,-40+bob);ctx.stroke();
  ctx.globalCompositeOperation='lighter';
  const lit=0.25+0.5*(P.luz/100);glow(1,-46+bob,30,'255,190,90',0.25+lit*0.3);
  flame(1,-39+bob,12+P.luz/100*5,'#ff9a3a','#ffe8a0');
  if(p.healT>0)glow(0,-16,40+p.healT*30,'255,210,122',0.4);
  ctx.restore();
}
function drawPlayer(){
  for(const tr of P.trail)drawIlo(tr.x+P.w/2-cam.x,tr.y+P.h-cam.y,tr.face,tr.a*0.6,true);

    txt(String(i+1),r.x+r.w/2,r.y+lift+50,`bold 16px ${FD}`,OUT,'center');
    txt(b.name,r.x+r.w/2,r.y+lift+100,`24px ${FD}`,sel?g.color:'#efe2c8','center',4);
    ctx.font=`17px ${FB}`;wrap(b.desc,r.w-40).forEach((l,j)=>txt(l,r.x+r.w/2,r.y+lift+134+j*23,`17px ${FB}`,'#d8cbb6','center'));});
  txt('← → elegir  ·  E / Enter aceptar  ·  o pulsa 1, 2, 3',VW/2,460,`16px ${FB}`,'#9a8a9c','center',3);
}
function drawShop(){
  ctx.fillStyle='rgba(5,2,8,0.75)';ctx.fillRect(0,0,VW,VH);
  txt('El Molde',VW/2,80,`40px ${FD}`,'#ffc66e','center',5);

function drawTitle(){
  ctx.fillStyle='rgba(5,2,8,0.6)';ctx.fillRect(0,0,VW,VH);
  ctx.save();ctx.globalCompositeOperation='lighter';glow(VW/2,170,300,'245,185,96',0.25);ctx.restore();

  txt('Un descenso entre cera y ceniza',VW/2,210,`italic 22px ${FB}`,'#f5b960','center',4);

  const a=0.6+0.4*Math.sin(time*3);ctx.globalAlpha=a;txt('Haz clic aquí y pulsa Enter para descender',VW/2,488,`22px ${FD}`,'#efe2c8','center',4);ctx.globalAlpha=1;
  if(meta.deaths||meta.cera)txt(`Descensos: ${meta.deaths+1}  ·  Cera: ${meta.cera}`+(meta.boss?'  ·  Llama encendida':''),VW/2,520,`15px ${FB}`,'#9a8a9c','center',3);
}

function drawPause(){
  ctx.fillStyle='rgba(5,2,8,0.7)';ctx.fillRect(0,0,VW,VH);txt('Pausa',VW/2,200,`48px ${FD}`,'#efe2c8','center',5);
  txt('Esc o Enter para seguir',VW/2,250,`20px ${FB}`,'#d8cbb6','center',3);
  txt(eraseArm>0?'Pulsa B otra vez para borrar todo el progreso':'B dos veces: borrar el progreso guardado',VW/2,320,`17px ${FB}`,eraseArm>0?'#ff6a5a':'#9a8a9c','center',3);
}

function draw(){
  ctx.save();
  if(shake>0&&!REDUCED)ctx.translate(rand(-shake,shake)*0.6,rand(-shake,shake)*0.6);
  drawBg();drawEmbers();
  ctx.drawImage(tiles,Math.round(-cam.x),Math.round(-cam.y));
  drawProps();for(const e of enemies)drawEnemy(e);drawPickups();
  if(state!=='dead')drawPlayer();
  drawSlashes();drawProjs();drawParts();drawNums();
  ctx.restore();
  drawVignette();
  if(state!=='title')drawHUD();
  if(flashA>0){ctx.globalAlpha=flashA*(flashCol==='#000'?1:0.6);ctx.fillStyle=flashCol;ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=1;}
  if(state==='title')drawTitle();else if(state==='dialog')drawDialog();else if(state==='choice')drawChoice();else if(state==='shop')drawShop();
  else if(state==='dead')drawDead();else if(state==='end')drawEnd();else if(state==='pause')drawPause();
  if(state==='trans'){const t=trans.t,a=t<0.18?t/0.18:1-(t-0.18)/0.18;ctx.fillStyle=`rgba(0,0,0,${clamp(a,0,1)})`;ctx.fillRect(0,0,VW,VH);}
}

// ---------- arranque ----------
newRun();loadRoom('santuario','P');
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;acc+=dt;let steps=0;
  while(acc>=1/60&&steps<5){update(1/60);acc-=1/60;steps++;for(const k in pressed)delete pressed[k];}
  if(steps>=5)acc=0;
  draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.focus();
})();
</script>
